<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="1920"
   height="1080"
   viewBox="0 0 1920 1080"
   version="1.1"
   id="fedora-45-logo-wallpaper">
  <title>Fedora 45 WebLinux Wallpaper</title>
  <defs>
    <!-- Base Fedora Blue background gradient (#294172 -> #3C6EB4) -->
    <linearGradient id="bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3157" />
      <stop offset="48%" stop-color="#294172" />
      <stop offset="100%" stop-color="#223762" />
    </linearGradient>

    <!-- Soft central radial glow (#3C6EB4 / #51A2DA) for focal depth -->
    <radialGradient id="center-glow" cx="50%" cy="48%" r="46%" fx="50%" fy="48%">
      <stop offset="0%" stop-color="#51a2da" stop-opacity="0.34" />
      <stop offset="45%" stop-color="#3c6eb4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#294172" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle top-right & bottom-left atmospheric accents -->
    <radialGradient id="corner-glow-tr" cx="85%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#51a2da" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#294172" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="corner-glow-bl" cx="15%" cy="88%" r="42%">
      <stop offset="0%" stop-color="#3c6eb4" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#294172" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle vignette for edge icon readability -->
    <radialGradient id="edge-vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#192848" stop-opacity="0" />
      <stop offset="100%" stop-color="#131f39" stop-opacity="0.42" />
    </radialGradient>

    <!-- Soft halo behind the Fedora logomark -->
    <radialGradient id="logo-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#51a2da" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#51a2da" stop-opacity="0" />
    </radialGradient>

    <!-- Drop shadow filter for crisp separation of the logomark -->
    <filter id="logo-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0f1a30" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base canvas -->
  <rect width="1920" height="1080" fill="url(#bg-base)" />
  <rect width="1920" height="1080" fill="url(#corner-glow-tr)" />
  <rect width="1920" height="1080" fill="url(#corner-glow-bl)" />
  <rect width="1920" height="1080" fill="url(#center-glow)" />

  <!-- Restrained geometric Fedora-blue arcs for depth without clutter -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.045">
    <circle cx="960" cy="520" r="245" stroke-width="1.5" />
    <circle cx="960" cy="520" r="360" stroke-width="1" stroke-opacity="0.035" />
    <circle cx="960" cy="520" r="520" stroke-width="1" stroke-opacity="0.025" />
  </g>
  <g fill="none" stroke="#51a2da" stroke-opacity="0.08">
    <path d="M -120,860 Q 480,680 960,520 T 2040,180" stroke-width="1.5" />
    <path d="M -120,940 Q 520,740 960,520 T 2040,260" stroke-width="1" stroke-opacity="0.05" />
  </g>

  <!-- Vignette for clean desktop icon contrast around borders -->
  <rect width="1920" height="1080" fill="url(#edge-vignette)" />

  <!-- Soft halo behind centered Fedora logomark -->
  <circle cx="960" cy="520" r="250" fill="url(#logo-halo)" />

  <!--
    Exact authentic Fedora Logomark embedded verbatim from
    apps/web/public/branding/fedora/fedora-logo.svg (viewBox 0 0 252.32 252.32).
    Scaled 1.15x (290.168 x 290.168) and centered at (960, 520).
  -->
  <g transform="translate(814.916, 374.916) scale(1.15)" filter="url(#logo-shadow)">
    <g
       id="g211"
       style="stroke-width:0.675354"
       transform="matrix(5.5962301,0,0,5.5964029,-147.27483,-598.13352)">
      <path
         d="m 48.859988,106.87821 c -12.444941,0 -22.53368,10.08309 -22.541794,22.52521 h -0.0014 v 17.44486 h 0.0014 c 0.0056,2.8247 2.297289,5.11246 5.123392,5.11246 0.0071,0 0.01799,0 0.02505,0 h 0.0014 17.399 c 12.446352,-0.007 22.53368,-10.09544 22.53368,-22.54074 0,-12.45058 -10.091561,-22.54179 -22.542147,-22.54179 z"
         style="fill:#51a2da;fill-opacity:1;fill-rule:nonzero;stroke:none;stroke-width:0.238252"
         id="path244" />
      <path
         d="m 53.42846,116.15238 c -3.51543,0 -6.620227,2.64725 -7.050263,6.11999 -0.02893,0.29069 -0.04269,0.5013 -0.0441,0.76483 -0.01517,4.69053 0.03034,9.67775 0.0014,14.19366 0,2.72309 -2.033764,4.57658 -4.580467,4.57658 -2.550936,0 -4.606925,-2.03694 -4.606925,-4.58082 0.04269,-2.79188 2.271183,-4.56 4.878211,-4.63691 h 0.02364 l 2.638778,-0.0222 v -3.7525 l -2.640189,0.018 c -4.74345,-0.0441 -8.516408,3.66995 -8.653991,8.39364 0,4.59176 3.778602,8.33861 8.359069,8.33861 4.321528,0 7.918097,-3.38032 8.310739,-7.60554 0.0568,-1.43862 0.03034,-3.33198 0.03034,-3.33198 0.0071,-0.7814 -0.01517,-0.49883 -0.0067,-2.05035 l 3.279775,-0.0222 c 2.539647,0.0194 2.514952,-3.80894 -0.02505,-3.75638 l -3.254727,0.0219 c 0,-1.9251 0.03034,-3.8421 0,-5.77109 0.0042,-1.66758 1.5875,-3.13937 3.340452,-3.13937 1.754012,0 3.607506,0.87666 3.607506,3.14325 0,0.32385 -0.0081,0.51153 -0.02611,0.63148 -0.195791,1.05127 0.523523,2.05316 1.581856,2.20486 1.058333,0.14993 2.028472,-0.61207 2.133247,-1.6757 0.06068,-0.42051 0.0635,-0.78987 0.0635,-1.16064 0,-3.99767 -3.574697,-6.90104 -7.360003,-6.90104 z"
         style="fill:#fafafa;fill-opacity:1;fill-rule:nonzero;stroke:none;stroke-width:0.238252"
         id="path246" />
    </g>
  </g>
</svg>
