<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Alpine Linux 3.24.4 Wallpaper">
  <defs>
    <!-- Deep Alpine Slate-Navy to Alpine Blue background gradient -->
    <linearGradient id="alpine-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061B29"/>
      <stop offset="52%" stop-color="#082436"/>
      <stop offset="100%" stop-color="#0B3B56"/>
    </linearGradient>

    <!-- Subtle centered radial glow for focal depth -->
    <radialGradient id="alpine-glow" cx="50%" cy="45%" r="48%" fx="50%" fy="45%">
      <stop offset="0%" stop-color="#0D597F" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#0A3A54" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#082436" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle geometric ridge shading -->
    <linearGradient id="ridge-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D597F" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#082436" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ridge-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1479AB" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#082436" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft drop shadow behind the central emblem -->
    <filter id="emblem-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#031018" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Base minimalist background -->
  <rect width="1920" height="1080" fill="url(#alpine-bg)"/>
  <rect width="1920" height="1080" fill="url(#alpine-glow)"/>

  <!-- Minimalist low-contrast alpine ridge geometry (kept subtle for desktop icon readability) -->
  <polygon points="0,1080 0,810 420,580 860,860 1240,640 1920,960 1920,1080" fill="url(#ridge-left)"/>
  <polygon points="620,1080 1180,690 1560,880 1920,680 1920,1080" fill="url(#ridge-right)"/>
  <path d="M 0,810 L 420,580 L 860,860 L 1240,640 L 1920,960" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5"/>
  <path d="M 620,1080 L 1180,690 L 1560,880 L 1920,680" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1.5"/>

  <!-- Authentic Alpine Linux Mountain Emblem (from apps/web/public/branding/alpine/alpine-icon.svg) -->
  <!-- White backing hexagon provides crisp white snow-capped mountain cutouts inside the #0D597F Alpine Blue hexagon -->
  <g transform="translate(691.2, 206.2) scale(1.05)" filter="url(#emblem-shadow)">
    <path fill="#FFFFFF" d="M352.02 89.7 448 256 352.02 422.3H159.98L64 256 159.98 89.7Z"/>
