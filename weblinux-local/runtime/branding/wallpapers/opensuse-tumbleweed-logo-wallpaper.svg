<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep openSUSE teal canvas gradient for clean desktop icon legibility -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091D26"/>
      <stop offset="52%" stop-color="#173F4F"/>
      <stop offset="100%" stop-color="#0C2733"/>
    </linearGradient>

    <!-- Diagonal ambient wash -->
    <linearGradient id="washGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#173F4F" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#35B9AB" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#73BA25" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Center radial glow behind the Tumbleweed emblem -->
    <radialGradient id="centerGlow" cx="50%" cy="47.7%" r="38%">
      <stop offset="0%" stop-color="#35B9AB" stop-opacity="0.24"/>
      <stop offset="45%" stop-color="#173F4F" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#091D26" stop-opacity="0"/>
    </radialGradient>

    <!-- openSUSE green accent glow -->
    <radialGradient id="greenAccent" cx="72%" cy="28%" r="36%">
      <stop offset="0%" stop-color="#73BA25" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#73BA25" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="greenAccentLow" cx="26%" cy="78%" r="34%">
      <stop offset="0%" stop-color="#73BA25" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#73BA25" stop-opacity="0"/>
    </radialGradient>

    <!-- Sweeping ribbon gradients -->
    <linearGradient id="ribbonGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#73BA25" stop-opacity="0.02"/>
      <stop offset="45%" stop-color="#73BA25" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#35B9AB" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="ribbonTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35B9AB" stop-opacity="0.02"/>
      <stop offset="50%" stop-color="#35B9AB" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#73BA25" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Subtle drop shadow for emblem separation -->
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#041016" flood-opacity="0.55"/>
    </filter>

    <!-- Subtle edge vignette to frame the 16:9 desktop -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="65%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#041016" stop-opacity="0.38"/>
    </radialGradient>
  </defs>

  <!-- Base canvas -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#washGrad)"/>
  <rect width="1920" height="1080" fill="url(#greenAccent)"/>
  <rect width="1920" height="1080" fill="url(#greenAccentLow)"/>

  <!-- Flowing rolling-release waves -->
  <path d="M-120,860 C340,740 620,940 1040,660 C1420,405 1620,210 2040,140 L2040,360 C1660,420 1440,590 1060,840 C660,1100 320,940 -120,1040 Z" fill="url(#ribbonGreen)"/>
  <path d="M-120,240 C320,120 680,300 1060,520 C1420,730 1680,830 2040,760 L2040,940 C1660,1010 1380,890 1010,670 C640,450 280,300 -120,400 Z" fill="url(#ribbonTeal)"/>

  <!-- Crisp geometric vector arcs -->
  <path d="M-60,790 C420,660 720,840 1120,560 C1460,320 1720,220 1980,190" fill="none" stroke="#73BA25" stroke-width="1.5" stroke-opacity="0.22"/>
  <path d="M-60,310 C380,210 740,380 1100,590 C1460,800 1720,860 1980,820" fill="none" stroke="#35B9AB" stroke-width="1.5" stroke-opacity="0.20"/>

  <!-- Subtle concentric focal rings around emblem -->
  <circle cx="960" cy="515" r="245" fill="none" stroke="#35B9AB" stroke-width="1.25" stroke-opacity="0.14"/>
  <circle cx="960" cy="515" r="325" fill="none" stroke="#73BA25" stroke-width="1" stroke-opacity="0.11"/>
  <circle cx="960" cy="515" r="420" fill="none" stroke="#35B9AB" stroke-width="1" stroke-opacity="0.06"/>

  <!-- Center ambient glow -->
  <rect width="1920" height="1080" fill="url(#centerGlow)"/>

  <!-- Authentic openSUSE Tumbleweed / Geeko emblem from apps/web/public/branding/opensuse/logo-tumbleweed.svg -->
  <g transform="translate(960, 515) scale(2.65) translate(-64, -64)" filter="url(#emblemShadow)">
    <path transform="matrix(-.87465 0 0 .87465 120.75 8.0741)" d="m94.992-0.066849c18.715-0.044873 33.956 15.196 33.911 33.911-0.04486 18.715-15.321 33.989-34.036 34.034l-8.4141 0.020097 0.017864-0.002233c-6e-3 1.4e-5 -0.007498-1.3e-5 -0.013398 0h-0.002233c-7.6468 0.017388-14.32 0.032773-17.572 0.040195-0.009725 4.4623-0.040839 18.807-0.058059 25.984-0.044878 18.715-15.319 33.991-34.034 34.036-18.715 0.04487-33.956-15.196-33.911-33.911 0.044867-18.715 15.321-33.989 34.036-34.034 2.1936-0.00527 4.5166-0.010064 7.9407-0.017864 7.7782-0.017708 14.744-0.032937 18.041-0.040195 0.009726-4.4623 0.040848-18.807 0.058059-25.984 0.04487-18.715 15.321-33.991 34.036-34.036zm0.020097 8.0055c-1.103 0.0026456-2.187 0.081744-3.2535 0.2166v28.826h28.936c0.12707-1.0356 0.20064-2.0878 0.20321-3.1575 0.0345-14.39-11.496-25.92-25.885-25.885zm-11.259 2.5702c-8.739 4.2031-14.767 13.124-14.792 23.478-0.01718 7.1648-0.048059 21.454-0.058059 25.946 4.4917-0.0099 18.779-0.040849 25.943-0.058059 10.391-0.024925 19.338-6.0976 23.523-14.888h-34.617v-34.478zm-22.873 57.447c-4.4931 0.00995-18.781 0.040851-25.946 0.058059-10.529 0.025256-19.571 6.2614-23.681 15.241h34.474v34.264c8.9016-4.1421 15.07-13.146 15.095-23.619 0.01719-7.1648 0.048059-21.452 0.058059-25.943zm-23.157 23.3h-28.679c-0.10066 0.92285-0.15627 1.8597-0.15855 2.8092-0.034516 14.39 11.496 25.92 25.885 25.885 0.99889-0.00239 1.9828-0.06749 2.9521-0.17864v-28.516z" color="#000000" fill="#35b9ab" fill-rule="evenodd" stroke-linecap="square" style="-inkscape-stroke:none"/>
  </g>

  <!-- Subtle edge vignette -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
